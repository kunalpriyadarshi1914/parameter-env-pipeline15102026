
trigger:
  branches:
    include:
      - main
      - feature/*
  paths:
    include:
      - parent_modules/prod/**

parameters:
- name: KyaScanChalega
  displayName: 'Prod Scan chalega kya?'
  type: string
  default: 'chalega bhai'
  values:
    - 'chalega bhai'
    - 'nahi chalega bhai'

- name: KyaPlanChalega
  displayName: 'Prod Plan chalega kya?'
  type: string
  default: 'chalega bhai'
  values:
    - 'chalega bhai'
    - 'nahi chalega bhai'

- name: KyaApplyChalega
  displayName: 'Prod Apply chalega kya?'
  type: string
  default: 'chalega bhai'
  values:
    - 'chalega bhai'
    - 'nahi chalega bhai'

pool: env-pool

stages:
- stage: Scan
  displayName: 'Prod Secret Scan'
  condition: eq('${{ parameters.KyaScanChalega }}', 'chalega bhai')
  jobs:
  - job: ProdScan
    steps:
    - checkout: self
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          $path = "$(Build.SourcesDirectory)/parent_modules/prod"
          if (!(Test-Path $path)) { throw "Prod directory not found" }
          trufflehog filesystem "$path" --results=verified,unknown

- stage: Plan
  displayName: 'Prod Terraform Init and Plan'
  dependsOn: Scan
  condition: |
    and(
      in(dependencies.Scan.result, 'Succeeded', 'Skipped'),
      eq('${{ parameters.KyaPlanChalega }}', 'chalega bhai')
    )
  jobs:
  - job: ProdPlan
    steps:
    - checkout: self
    - task: TerraformTask@5
      displayName: 'Prod Init'
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(Build.SourcesDirectory)/parent_modules/prod'
        backendServiceArm: 'env-svc'
        backendAzureRmStorageAccountName: 'parameterstg'
        backendAzureRmContainerName: 'parametercnt1'
        backendAzureRmKey: 'prod.tfstate'

    - task: TerraformTask@5
      displayName: 'Prod Plan'
      inputs:
        provider: azurerm
        command: plan
        workingDirectory: '$(Build.SourcesDirectory)/parent_modules/prod'
        environmentServiceNameAzureRM: 'env-svc'

- stage: Approval
  displayName: 'Approve Prod Apply'
  dependsOn: Plan
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq('${{ parameters.KyaPlanChalega }}', 'chalega bhai'),
      eq('${{ parameters.KyaApplyChalega }}', 'chalega bhai')
    )
  pool: server
  jobs:
  - job: ProdApproval
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: 'kp4u2011@gmail.com'
        approvers: 'kp4u2011@gmail.com'
        instructions: 'Review and approve production infrastructure changes.'
        onTimeout: reject

- stage: Apply
  displayName: 'Prod Terraform Apply'
  dependsOn:
    - Plan
    - Approval
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq('${{ parameters.KyaPlanChalega }}', 'chalega bhai'),
      eq('${{ parameters.KyaApplyChalega }}', 'chalega bhai')
    )
  jobs:
  - job: ProdApply
    steps:
    - checkout: self
    - task: TerraformTask@5
      displayName: 'Prod Init'
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(Build.SourcesDirectory)/parent_modules/prod'
        backendServiceArm: 'env-svc'
        backendAzureRmStorageAccountName: 'parameterstg'
        backendAzureRmContainerName: 'parametercnt1'
        backendAzureRmKey: 'prod.tfstate'

    - task: TerraformTask@5
      displayName: 'Prod Apply'
      inputs:
        provider: azurerm
        command: apply
        workingDirectory: '$(Build.SourcesDirectory)/parent_modules/prod'

